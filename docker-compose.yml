services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shot
      POSTGRES_PASSWORD: shot
      POSTGRES_DB: shotlist
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shot -d shotlist"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://shot:shot@db:5432/shotlist
      ENV: compose
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
