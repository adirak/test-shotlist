apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shotlist
  namespace: shotlist
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: api, port: { number: 8000 } }
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: web, port: { number: 80 } }
